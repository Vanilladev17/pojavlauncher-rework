name: Build APK

# Собирает подписанный APK при пуше в main (артефакт) и публикует релиз по тегу v*.
on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          if [ -z "$SDK" ] || [ ! -d "$SDK" ]; then SDK=/usr/local/lib/android/sdk; fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          # берём самый свежий рабочий sdkmanager (у ubuntu-latest бывает сломан «latest»)
          SDKMGR=""
          for c in "$SDK"/cmdline-tools/*/bin/sdkmanager; do
            [ -x "$c" ] && SDKMGR="$c"
          done
          if [ -z "$SDKMGR" ]; then
            echo "::error::sdkmanager не найден в $SDK"
            exit 1
          fi
          echo "sdkmanager: $SDKMGR"
          echo "SDKMGR=$SDKMGR" >> "$GITHUB_ENV"
          yes | "$SDKMGR" --licenses > /dev/null 2>&1 || true

      - name: Install NDK, CMake and platform
        run: |
          "$SDKMGR" --install "ndk;29.0.14206865" "cmake;3.22.1" "platforms;android-36" "build-tools;36.0.0"
          printf 'sdk.dir=%s\nndk.dir=%s/ndk/29.0.14206865\n' "$ANDROID_HOME" "$ANDROID_HOME" > local.properties
          cat local.properties

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.REWORK_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app_pojavlauncher/rework_release.jks
            echo "Ключ подписи Rework загружен из секрета"
          else
            echo "::warning::Секрет REWORK_KEYSTORE_BASE64 не задан — сборка будет подписана debug-ключом"
          fi

      - name: Build release APK
        env:
          REWORK_KEYSTORE_PASSWORD: ${{ secrets.REWORK_KEYSTORE_PASSWORD }}
        run: ./gradlew :app_pojavlauncher:assembleFullRelease --no-daemon

      - name: Verify signature
        run: |
          APK=$(find app_pojavlauncher/build/outputs/apk/full/release -name "*.apk" | head -1)
          echo "APK=$APK" >> "$GITHUB_ENV"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signature.txt
          grep -q "PojavLauncher Rework" signature.txt || echo "::warning::APK подписан не ключом Rework"
          md5sum "$APK" | tee "$APK.md5" > /dev/null
          ls -lh "$APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: PojavLauncher-Rework-apk
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          name: PojavLauncher Rework ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
